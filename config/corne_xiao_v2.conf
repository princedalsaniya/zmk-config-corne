# Required for nRF52840: unlocks NFC pads for use as regular GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# Deep sleep
CONFIG_ZMK_SLEEP=y

# Idle timeout: 5 minutes of no keypress → display off, RGB off, radio low-power
CONFIG_ZMK_IDLE_TIMEOUT=120000

# Deep sleep timeout: 15 minutes after idle → full deep sleep (~0.5 µA draw)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMK Studio (live remap via USB)
CONFIG_ZMK_STUDIO=y
